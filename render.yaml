# Render Blueprint 参考（可选）。也可在控制台手动创建 Web Service + PostgreSQL。
# 注意：请在控制台配置真实 DATABASE_URL，不要把密码写入本文件。

services:
  - type: web
    name: signalwatch
    runtime: node
    plan: free
    nodeVersion: "20"
    buildCommand: npm install --legacy-peer-deps && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_APP_NAME
        value: SignalWatch
      - key: NEXT_PUBLIC_DATA_MODE
        value: SIMULATED
      - key: ENABLE_SERVER_SCHEDULER
        value: "1"
      - key: SCHEDULER_INTERVAL_MS
        value: "20000"
      - key: SCHEDULER_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: signalwatch-db
          property: connectionString

databases:
  - name: signalwatch-db
    plan: free
    databaseName: signalwatch
    user: signalwatch
