# Render Blueprint：免费 Web Service + 免费 PostgreSQL
# Node 版本请用 NODE_VERSION / .nvmrc / package.json engines（无 nodeVersion 字段）
# 勿在本文件写入真实密码；SCHEDULER_SECRET 由平台 generateValue 生成

services:
  - type: web
    name: signalwatch
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install --legacy-peer-deps && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_APP_NAME
        value: SignalWatch
      - key: NEXT_PUBLIC_DATA_MODE
        value: SIMULATED
      - key: ENABLE_SERVER_SCHEDULER
        value: "1"
      - key: SCHEDULER_INTERVAL_MS
        value: "20000"
      - key: SCHEDULER_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: signalwatch-db
          property: connectionString

databases:
  - name: signalwatch-db
    plan: free
    databaseName: signalwatch
    user: signalwatch
